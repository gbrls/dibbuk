[package]
name = "dibbuk"
version = "0.1.0"
edition = "2024"

[dependencies]
thiserror = "2.0.12"
anyhow = "1.0"
tokio = { version = "1", features = ["full"] }
nom = "8.0.0"
ratatui = "0.29.0"
color-eyre = "0.6.3"
crossterm = {version = "0.28.1", features = ["event-stream"]}
futures-util = "0.3.31"
unicode-width = "0.2.0"
scopeguard = "1.2.0"
clap = { version = "4.5.36", features = ["derive"] }
regex = "1.11.1"
proc-maps = "0.4.0"
console-subscriber = "0.4.1"
read-process-memory = "0.1.6"
tachyonfx = { version = "0.13.0", features = ["sendable"] }
capstone = "0.13.0"
elf = "0.7.4"
log = "0.4.27"
futures = "0.3.31"
libc = "0.2.175"
facet = "0.28.1"
facet-pretty = "0.28.0"
facet-json = "0.28.2"
steel-core = { git="https://github.com/mattwparas/steel.git", branch = "master" }
steel-derive = "0.6.0"
steel-repl = { git="https://github.com/mattwparas/steel.git", branch = "master" }
